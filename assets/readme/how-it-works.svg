<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">How a Team-mates run works</title>
  <desc id="how-it-works-desc">Five steps drawn as terminal panes: you and the lead plan and approve the roles; the lead spawns one pane per teammate; teammates take work from a tasks.md backlog; challenge rounds let each teammate agree, dispute or refine the others' findings; the lead writes the synthesis and records verified facts in .team/facts.md.</desc>

  <defs>
    <marker id="hiw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>

  <!-- Arrows between panes -->
  <g id="hiw-links" fill="none" stroke="#8b949e" stroke-width="2">
    <path d="M234 160 H274" marker-end="url(#hiw-arrow)"/>
    <path d="M464 160 H504" marker-end="url(#hiw-arrow)"/>
    <path d="M694 160 H734" marker-end="url(#hiw-arrow)"/>
    <path d="M924 160 H964" marker-end="url(#hiw-arrow)"/>
  </g>

  <!-- Each step is a pane: title bar with step number, then a title and two lines -->
  <g id="hiw-steps" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g id="step-plan">
      <rect x="48" y="70" width="186" height="180" rx="8" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
      <path d="M48 110 H234" stroke="#f0b429" stroke-width="1.5"/>
      <text x="66" y="98" font-size="20" fill="#f0b429">01 lead</text>
      <text x="66" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Plan</text>
      <text x="66" y="190" font-size="20" fill="#c9d1d9">you + lead</text>
      <text x="66" y="220" font-size="20" fill="#c9d1d9">approve roles</text>
    </g>
    <g id="step-spawn">
      <rect x="278" y="70" width="186" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <path d="M278 110 H464" stroke="#30363d" stroke-width="1.5"/>
      <text x="296" y="98" font-size="20" fill="#8b949e">02 panes</text>
      <text x="296" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Spawn</text>
      <text x="296" y="190" font-size="20" fill="#c9d1d9">one pane per</text>
      <text x="296" y="220" font-size="20" fill="#c9d1d9">teammate</text>
    </g>
    <g id="step-backlog">
      <rect x="508" y="70" width="186" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <path d="M508 110 H694" stroke="#30363d" stroke-width="1.5"/>
      <text x="526" y="98" font-size="20" fill="#8b949e">03 tasks.md</text>
      <text x="526" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Work</text>
      <text x="526" y="190" font-size="20" fill="#c9d1d9">report, then</text>
      <text x="526" y="220" font-size="20" fill="#c9d1d9">take the next</text>
    </g>
    <g id="step-challenge">
      <rect x="738" y="70" width="186" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <path d="M738 110 H924" stroke="#30363d" stroke-width="1.5"/>
      <text x="756" y="98" font-size="20" fill="#8b949e">04 rounds</text>
      <text x="756" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Challenge</text>
      <text x="756" y="190" font-size="20" fill="#c9d1d9">agree/dispute</text>
      <text x="756" y="220" font-size="20" fill="#c9d1d9">or refine</text>
    </g>
    <g id="step-synthesis">
      <rect x="968" y="70" width="186" height="180" rx="8" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
      <path d="M968 110 H1154" stroke="#f0b429" stroke-width="1.5"/>
      <text x="986" y="98" font-size="20" fill="#f0b429">05 lead</text>
      <text x="986" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Synthesis</text>
      <text x="986" y="190" font-size="20" fill="#c9d1d9">survivors go</text>
      <text x="986" y="220" font-size="20" fill="#c9d1d9">to facts.md</text>
    </g>
  </g>
</svg>
