<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">How /team works</title>
  <desc id="how-it-works-desc">You brainstorm and approve the plan with the lead. The lead hands roles to an optional tech lead and product manager, starts teammates in panes that fan out to subagents, and moves work through a tasks.md backlog where a teammate that reports takes the next task. The monitor tracks overall progress and team ETA, build branches and PRs pass the no-mistakes gate and gh, and synthesis records verified findings in .team/facts.md.</desc>

  <defs>
    <marker id="how-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="how-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b429"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="0" fill="#0d1117"/>

  <!-- Arrows first, so boxes sit on top -->
  <g id="how-links" fill="none" stroke="#8b949e" stroke-width="2">
    <path d="M260 170 H340" marker-end="url(#how-arrow)"/>
    <path d="M340 210 H260" marker-end="url(#how-arrow)"/>
    <path d="M560 190 H640" stroke-dasharray="6 5" marker-end="url(#how-arrow)"/>
    <path d="M860 190 H940" stroke-dasharray="6 5" marker-end="url(#how-arrow)"/>
    <path d="M450 130 V96 H1050 V130" marker-end="url(#how-arrow)"/>
    <path d="M1000 250 V360" marker-end="url(#how-arrow)"/>
    <path d="M1110 360 V250" stroke="#f0b429" marker-end="url(#how-arrow-accent)"/>
    <path d="M940 420 H860" marker-end="url(#how-arrow)"/>
    <path d="M640 420 H560" marker-end="url(#how-arrow)"/>
    <path d="M340 420 H260" marker-end="url(#how-arrow)"/>
  </g>

  <!-- Arrow labels on opaque masks, 6 to 10 units clear of the stroke -->
  <g id="how-labels" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">
    <rect x="273" y="141" width="54" height="22" fill="#0d1117"/>
    <text x="300" y="158" text-anchor="middle">BRIEF</text>
    <rect x="262" y="217" width="76" height="22" fill="#0d1117"/>
    <text x="300" y="234" text-anchor="middle">APPROVE</text>
    <rect x="573" y="165" width="54" height="22" fill="#0d1117"/>
    <text x="600" y="182" text-anchor="middle">SCOPE</text>
    <rect x="873" y="165" width="54" height="22" fill="#0d1117"/>
    <text x="900" y="182" text-anchor="middle">TASKS</text>
    <rect x="723" y="69" width="54" height="22" fill="#0d1117"/>
    <text x="750" y="86" text-anchor="middle">SPAWN</text>
    <rect x="920" y="293" width="71" height="22" fill="#0d1117"/>
    <text x="988" y="310" text-anchor="end">REPORT</text>
    <rect x="1119" y="281" width="49" height="22" fill="#0d1117"/>
    <text x="1122" y="298" fill="#f0b429">NEXT</text>
    <rect x="1119" y="305" width="49" height="22" fill="#0d1117"/>
    <text x="1122" y="322" fill="#f0b429">TASK</text>
    <rect x="873" y="395" width="54" height="22" fill="#0d1117"/>
    <text x="900" y="412" text-anchor="middle">WATCH</text>
    <rect x="579" y="395" width="43" height="22" fill="#0d1117"/>
    <text x="600" y="412" text-anchor="middle">GATE</text>
    <rect x="268" y="395" width="65" height="22" fill="#0d1117"/>
    <text x="300" y="412" text-anchor="middle">RESULT</text>
  </g>

  <!-- Row 1: you, lead, optional roles, teammates -->
  <g id="how-row-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="node-you">
      <rect x="40" y="130" width="220" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="150" y="172" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">You</text>
      <text x="150" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">brainstorm</text>
      <text x="150" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">approve plan</text>
    </g>
    <g id="node-lead">
      <rect x="340" y="130" width="220" height="120" rx="6" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
      <text x="450" y="172" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Lead</text>
      <text x="450" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">main session</text>
      <text x="450" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">plans and relays</text>
    </g>
    <g id="node-tech-lead">
      <rect x="640" y="130" width="220" height="120" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="750" y="172" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Tech lead / PM</text>
      <text x="750" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">optional</text>
      <text x="750" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">owns the backlog</text>
    </g>
    <g id="node-teammates">
      <rect x="940" y="130" width="220" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="1050" y="172" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Teammates</text>
      <text x="1050" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">one pane each</text>
      <text x="1050" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">subagents fan out</text>
    </g>
  </g>

  <!-- Row 2: synthesis, PRs, monitor, backlog (flows right to left) -->
  <g id="how-row-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="node-synthesis">
      <rect x="40" y="360" width="220" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="150" y="402" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Synthesis</text>
      <text x="150" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">reported to you</text>
      <text x="150" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">.team/facts.md</text>
    </g>
    <g id="node-prs">
      <rect x="340" y="360" width="220" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="450" y="402" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Branches, PRs</text>
      <text x="450" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">no-mistakes gate</text>
      <text x="450" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">then gh</text>
    </g>
    <g id="node-monitor">
      <rect x="640" y="360" width="220" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="750" y="402" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">Monitor</text>
      <text x="750" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">overall %</text>
      <text x="750" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">team ETA</text>
    </g>
    <g id="node-backlog">
      <rect x="940" y="360" width="220" height="120" rx="6" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
      <text x="1050" y="402" text-anchor="middle" font-size="22" font-weight="600" fill="#e6edf3">tasks.md</text>
      <text x="1050" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">backlog</text>
      <text x="1050" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">next on report</text>
    </g>
  </g>

  <text x="40" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">dashed box = optional role   amber = focal steps</text>
</svg>
