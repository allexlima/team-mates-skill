<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
  <title id="t">The five steps of a /team run</title>
  <desc id="d">Plan, spawn, work, challenge, synthesis: plan the roles with the lead, spawn one pane per teammate, work through the tasks.md backlog, challenge each other's findings, and record the survivors in .team/facts.md.</desc>
  <rect width="1200" height="220" rx="20" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g stroke="#30363d" stroke-width="2"><path d="M232 110H256M472 110H496M712 110H736M952 110H976"/></g>
    <g fill="#161b22" stroke="#30363d" stroke-width="2">
      <rect x="24" y="50" width="208" height="120" rx="10"/><rect x="264" y="50" width="208" height="120" rx="10"/><rect x="504" y="50" width="208" height="120" rx="10"/><rect x="744" y="50" width="208" height="120" rx="10"/>
    </g>
    <rect x="984" y="50" width="192" height="120" rx="10" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
    <g font-size="30" font-weight="700" fill="#e6edf3">
      <text x="128" y="100">1 plan</text><text x="368" y="100">2 spawn</text><text x="608" y="100">3 work</text><text x="848" y="100">4 challenge</text><text x="1080" y="100" fill="#f0b429">5 keep</text>
    </g>
    <g font-size="20" fill="#8b949e">
      <text x="128" y="138">you approve roles</text><text x="368" y="138">one pane each</text><text x="608" y="138">tasks.md backlog</text><text x="848" y="138">agree or dispute</text><text x="1080" y="138">.team/facts.md</text>
    </g>
  </g>
</svg>
