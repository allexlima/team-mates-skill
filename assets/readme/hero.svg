<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Team-mates: /team for Claude Code</title>
  <desc id="d">A terminal prompt running /team, next to a pane grid: the lead on the left and four teammate panes in two columns, with states working, idle, needs you and finished. Illustrative layout.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#0d1117"/>
  <rect width="1200" height="440" rx="20" fill="url(#g)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="84" font-size="20" fill="#8b949e">claude code skill · MIT</text>
    <text x="60" y="176" font-size="84" font-weight="700" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Team-mates</text>
    <rect x="64" y="200" width="22" height="44" fill="#f0b429"/>
    <text x="98" y="234" font-size="30" fill="#f0b429">/team</text>
    <text x="64" y="294" font-size="24" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">One Claude session per pane.</text>
    <text x="64" y="328" font-size="24" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">They challenge each other's findings;</text>
    <text x="64" y="362" font-size="24" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the lead keeps what survives.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="640" y="56" width="140" height="328" rx="8" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
    <text x="660" y="96" font-weight="700" fill="#e6edf3">lead</text>
    <text x="660" y="132" fill="#8b949e">plan</text>
    <text x="660" y="162" fill="#8b949e">relay</text>
    <text x="660" y="192" fill="#8b949e">synth</text>
    <rect x="796" y="56" width="168" height="156" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="814" y="96" fill="#e6edf3">t-backend</text>
    <circle cx="820" cy="150" r="7" fill="#3fb950"/><text x="836" y="157" fill="#3fb950">working</text>
    <text x="814" y="192" fill="#8b949e">T2 · 60%</text>
    <rect x="980" y="56" width="168" height="156" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="998" y="96" fill="#e6edf3">t-review</text>
    <circle cx="1004" cy="150" r="7" fill="#58a6ff"/><text x="1020" y="157" fill="#58a6ff">idle</text>
    <text x="998" y="192" fill="#8b949e">T3 · 20%</text>
    <rect x="796" y="228" width="168" height="156" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="814" y="268" fill="#e6edf3">t-qa</text>
    <circle cx="820" cy="322" r="7" fill="#f85149"/><text x="836" y="329" fill="#f85149">needs you</text>
    <text x="814" y="364" fill="#8b949e">T4 · 90%</text>
    <rect x="980" y="228" width="168" height="156" rx="8" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="998" y="268" fill="#8b949e">t-docs</text>
    <text x="998" y="329" fill="#8b949e">✓ finished</text>
  </g>
  <text x="640" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">illustrative layout</text>
