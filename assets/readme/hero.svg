<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Team-mates: a team of Claude Code sessions in terminal panes</title>
  <desc id="hero-desc">Left: the Team-mates name and its /team command and a one-line promise. Right: the lead on the left and four teammate panes in a two-column grid, one of them already closed. Below: an illustrative monitor frame with overall task progress, a team ETA, a teammate that needs the user, and a backlog line. Illustrative run; the numbers are sample input, not a benchmark.</desc>

  <rect width="1200" height="732" fill="#0d1117"/>

  <!-- Title block -->
  <g id="hero-title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">/team · A CLAUDE CODE SKILL · MIT</text>
    <text x="56" y="168" font-size="88" font-weight="700" fill="#e6edf3">Team-mates</text>
    <text x="60" y="214" font-size="26" fill="#c9d1d9">A team of Claude sessions, one per pane.</text>
    <text x="60" y="246" font-size="26" fill="#c9d1d9">Teammates challenge each other's findings</text>
    <text x="60" y="278" font-size="26" fill="#c9d1d9">and the lead keeps what survives.</text>
  </g>

  <!-- Pane layout: lead on the left, teammates in a two-column grid -->
  <g id="hero-panes" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <rect x="690" y="40" width="120" height="182" rx="6" fill="#2b2110" stroke="#f0b429" stroke-width="2"/>
    <text x="706" y="78" font-size="22" font-weight="600" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">lead</text>
    <text x="706" y="110" fill="#8b949e">plans</text>
    <text x="706" y="134" fill="#8b949e">relays</text>
    
    <rect x="820" y="40" width="155" height="86" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="834" y="72" fill="#e6edf3">r1-tech-lead</text>
    <text x="834" y="102" fill="#8b949e">working</text>

    <rect x="985" y="40" width="155" height="86" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="999" y="72" fill="#e6edf3">r1-backend</text>
    <text x="999" y="102" fill="#8b949e">working</text>

    <rect x="820" y="136" width="155" height="86" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="834" y="168" fill="#e6edf3">r1-qa</text>
    <text x="834" y="198" fill="#8b949e">idle</text>

    <rect x="985" y="136" width="155" height="86" rx="6" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="999" y="168" fill="#8b949e">r1-docs</text>
    <text x="999" y="198" fill="#8b949e">closed</text>
  </g>

  <!-- Monitor frame: text copied from the real renderer (team.sh status), clock filled with a sample time -->
  <g id="hero-monitor" transform="translate(0 40)">
    <rect x="60" y="262" width="1080" height="382" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#c9d1d9">
      <text x="96" y="300" xml:space="preserve" fill="#e6edf3">r1 · 4/9 tasks · 12:04:31</text>
      <text x="96" y="324" xml:space="preserve">███████████░░░░░░░░░  ~58% · ETA ~16m</text>
      <text x="96" y="372" xml:space="preserve" fill="#f0b429">⚠ NEEDS YOU (1)</text>
      <text x="96" y="396" xml:space="preserve">[1] ◌ qa         idle · idle with work pending                                4m</text>
      <text x="96" y="444" xml:space="preserve" fill="#8b949e">    ROLE       STATE            STEP                     PROGRESS       ETA  AGE</text>
      <text x="96" y="468" xml:space="preserve">[2] tech-lead  ◐ investigating  T7: reviewing backend …  ███░░  60%    ~14m   1m</text>
      <text x="96" y="492" xml:space="preserve">[3] backend    ◐ drafting       T5: wiring the API       ██░░░  40%    ~30m   2m</text>
      <text x="96" y="540" xml:space="preserve">  ✓ 1 finished · 2 PRs</text>
      <text x="96" y="564" xml:space="preserve">  backlog: 5 pending · 1 unassigned</text>
      <text x="96" y="612" xml:space="preserve" fill="#8b949e">  1-3 focus pane · r refresh · q quit</text>
    </g>
  </g>

  <text x="60" y="712" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">Illustrative run: sample input, not a benchmark. Monitor text from the team.sh status renderer.</text>
</svg>
